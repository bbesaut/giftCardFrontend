name: CI

on:
  # Every change is checked on its pull request, against develop or main.
  pull_request:
    branches: [develop, main]
  # After a merge, develop and main are re-checked: the checks run again on the merged code.
  push:
    branches: [develop, main]

# A newer push to the same ref makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter version comes from pubspec.yaml (environment.flutter), the single source of truth.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build web
        run: flutter build web --release

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  sast:
    name: SAST (SonarQube Cloud)
    # Needs the coverage report produced by the quality gate.
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar needs the full history to attribute issues to new code.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      # Project settings live in sonar-project.properties. The scan fails the job when the
      # SonarQube quality gate fails.
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build only (nothing is pushed): proves the production image still builds.
      # The real API_BASE_URL is set on Render, this one is a placeholder.
      - name: Build image
        run: docker build --build-arg API_BASE_URL=https://api.example.invalid -t gift-card-front:ci .

      - name: Smoke test image
        run: |
          docker run -d --name smoke -e PORT=8080 -p 8080:8080 gift-card-front:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

  desktop-build:
    name: Desktop build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing must not hide the result of the others.
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter's Linux desktop toolchain and GTK headers are not preinstalled on the runner.
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      # Proves the installer still builds. The throwaway version is never published (see release.yml).
      - name: Build installer (windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./installer/windows/build-installer.ps1 -Version 0.0.0-ci

      - name: Smoke test installer (windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./installer/windows/test-installer.ps1 -Version 0.0.0-ci

      - name: Build disk image (macos)
        if: matrix.target == 'macos'
        run: ./installer/macos/build-dmg.sh 0.0.0-ci

      - name: Smoke test disk image (macos)
        if: matrix.target == 'macos'
        run: ./installer/macos/test-dmg.sh 0.0.0-ci

      - name: Build package (linux)
        if: matrix.target == 'linux'
        run: ./installer/linux/build-deb.sh 0.0.0-ci

      - name: Smoke test package (linux)
        if: matrix.target == 'linux'
        run: ./installer/linux/test-deb.sh 0.0.0-ci
