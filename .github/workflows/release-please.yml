name: Release Please

# Keeps a "release" pull request open on main. Merging it bumps the version in pubspec.yaml,
# updates CHANGELOG.md, creates the vX.Y.Z tag and the GitHub Release. The tag push then
# triggers the Release workflow, which builds and attaches the desktop packages.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A personal access token is required: pull requests and tags created with the default
      # GITHUB_TOKEN do not trigger other workflows, so CI would never run on the release pull
      # request and the Release workflow would never start on the tag.
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
